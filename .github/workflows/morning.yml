name: morning

# Daily autonomous run: sync sources → generate drafts → score & refine.
# Drafts land in the repo and a Telegram message goes out so you can
# review and approve from your phone before the first post slot at 12 UTC.

on:
  schedule:
    # Two slots, both off-the-hour to dodge GitHub's :00 high-load minute
    # where scheduled runs frequently fail with "runner not acquired".
    # The second slot is a backup: if today's draft already exists, the
    # job exits early as a no-op.
    - cron: "17 6 * * *"     # 06:17 UTC ≈ 09:17 EEST (summer) / 08:17 EET (winter) — primary
    - cron: "17 7 * * *"     # 07:17 UTC — catch-up if primary missed runner acquisition
  workflow_dispatch:
    inputs:
      date:
        description: "Override target date (YYYY-MM-DD). Default = today UTC."
        required: false
        default: ""

concurrency:
  group: x-engine-morning
  cancel-in-progress: false

permissions:
  contents: write          # commit drafts + state back to main

jobs:
  morning:
    runs-on: ubuntu-latest
    # Fail fast if `claude -p` wedges. Real-world budget observed:
    #   sync ~5-12 min · draft ~3-5 min · enhance ~6 drafts × ~60s = 6 min
    # Worst case ~25 min; cap at 30 to leave margin without letting a
    # hung run burn hours of GH Actions minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        # Pin to a major so a bad upstream release doesn't silently brick
        # the daily run. Bump intentionally via PR.
        run: |
          npm install -g '@anthropic-ai/claude-code@^2'
          claude --version

      - name: Resolve target date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            value="$INPUT_DATE"
          else
            value="$(date -u +%F)"
          fi
          if ! [[ "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::invalid date format: '$value' (need YYYY-MM-DD)"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # ---- 0. catch-up gate ------------------------------------------------
      # The 07:17 backup cron exists in case the 06:17 primary couldn't
      # acquire a runner. Skip only when the draft was *generated today*
      # — checking existence alone breaks if a stale file (e.g. a
      # hand-generated draft from days ago) already sits at that path.
      # We compare the file's mtime UTC date to today UTC.
      - name: Skip if draft was already generated today
        id: gate
        env:
          DATE: ${{ steps.date.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "manual dispatch — always run"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s "drafts/${DATE}.md" ]; then
            echo "drafts/${DATE}.md missing — primary did not run, generating"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file_mtime_date=$(date -u -r "drafts/${DATE}.md" +%F)
          today=$(date -u +%F)
          if [ "$file_mtime_date" = "$today" ]; then
            echo "drafts/${DATE}.md generated today (${file_mtime_date}) — backup is a no-op"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "drafts/${DATE}.md is stale (mtime ${file_mtime_date}, today ${today}) — regenerating"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- 1. sync sources --------------------------------------------------
      - name: Sync sources
        if: steps.gate.outputs.should_run == 'true'
        env:
          # Skip the obsidian-personal source — it needs a local vault that
          # doesn't exist on the CI runner.
          DISABLED_SOURCES: obsidian-personal
          # Don't fail the workflow if a single source (e.g. a flaky RSS feed)
          # errors — downstream steps run with the partial data we have.
          SYNC_TOLERATE_ERRORS: "1"
          # twitterapi.io for the peer-posts research agent.
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # Claude Code OAuth — bills against the Pro/Max subscription.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # gh CLI auth for the github-commits source.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:ci

      # ---- 2. generate today's drafts --------------------------------------
      - name: Draft
        if: steps.gate.outputs.should_run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run draft:ci -- --date=${{ steps.date.outputs.value }} --force

      # ---- 3. score + refine each draft ------------------------------------
      - name: Enhance
        if: steps.gate.outputs.should_run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run enhance:ci -- --file=drafts/${{ steps.date.outputs.value }}.md

      # ---- 4. commit + push back to main -----------------------------------
      - name: Commit + push
        id: commit
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drafts/${{ steps.date.outputs.value }}.md \
            sources/peer-posts/.state.json \
            || true
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "morning run ${{ steps.date.outputs.value }} [skip ci]"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- 5. ping Telegram so you know drafts are ready -------------------
      # `curl --data-urlencode` handles escaping; MSG embeds real \n via
      # printf so newlines render in Telegram instead of leaking %0A literals.
      - name: Notify Telegram (success)
        if: success() && steps.commit.outputs.committed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATE: ${{ steps.date.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          DRAFT_URL="https://github.com/${REPO}/blob/main/drafts/${DATE}.md"
          MSG=$(printf '🟢 Morning run done — drafts/%s.md is ready.\n\nReview + approve: %s\n\nOr ask the bot: "list drafts"' "$DATE" "$DRAFT_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" \
            > /dev/null

      - name: Notify Telegram (no changes)
        if: success() && steps.commit.outputs.committed == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATE: ${{ steps.date.outputs.value }}
        run: |
          MSG=$(printf 'ℹ️ Morning run finished but no changes to commit (drafts/%s.md unchanged).' "$DATE")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" \
            > /dev/null

      - name: Notify Telegram (failure)
        # `failure()` does NOT match a job cancelled by timeout-minutes,
        # so include `cancelled()` to ensure timeouts trigger a ping too.
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          MSG=$(printf '🔴 Morning run failed or timed out.\n\nLogs: %s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" \
            > /dev/null
